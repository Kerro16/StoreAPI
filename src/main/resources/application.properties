spring.jpa.database=POSTGRESQL
spring.datasource.platform=postgres
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.database.driverClassName=org.postgresql.Driver

# Secrets and environment-specific values come from environment variables (see .env.example).
# DB_PASSWORD and JWT_SECRET have no default on purpose: the app refuses to start without them.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Product}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

kerro.app.jwtCookieName=${JWT_COOKIE_NAME:store_cookie}
kerro.app.jwtSecret=${JWT_SECRET}
kerro.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
kerro.app.cookieSecure=${COOKIE_SECURE:false}
kerro.app.allowedOrigins=${ALLOWED_ORIGINS:http://localhost:4200}
